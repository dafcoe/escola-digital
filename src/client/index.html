<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <title>Escola Digital Reporter</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        display: flex;
        flex-direction: column;
        margin: 0;
        padding: 2rem;
        height: 100vh;
        min-height: 400px;
        color: #666;
        font-family: "Roboto", sans-serif;
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
        font-variation-settings: "wdth" 100;
        font-size: 1rem;
        background: linear-gradient(270deg, #ff9a9e, #fad0c4, #fbc2eb, #a1c4fd, #c2e9fb);
        background-size: 1000% 1000%;
        animation: gradientShift 60s ease infinite;
      }

      @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      .title {
        margin-top: 0;
        text-align: center;
        font-size: 2rem;
        font-weight: 500;
        color:#fff;
        text-shadow: 1px 1px #666;
      }

      .console {
        display: flex;
        flex: 1;
        margin: 0 auto;
        border-radius: 0.75rem;
        width: 100%;
        max-width: 90%;
        background-color: rgba(255, 255, 255, 0.5);
        box-shadow: 0 0.25rem 0.75rem rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }

      .console__actions {
        padding: 2rem;
        width: 35%;
        border-right: 1px solid rgba(255, 255, 255, 0.75);
      }

      .console__log {
        width: 65%;
        padding: 2rem;
      }

      form {
        width: 100%;
      }

      label {
        display: flex;
        flex-direction: column;
        margin-bottom: 1.5rem;
      }

      label span {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
        font-weight: 500;
      }

      input,
      textarea,
      button {
        width: 100%;
        padding: 0.75rem 1rem;
        border-radius: 0.5rem;
        font-family: "Roboto", sans-serif;
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
        font-variation-settings: "wdth" 100;
        font-size: 1rem;
        transition: all 0.25s ease-in-out;
      }

      input,
      textarea {
        border: 1px solid #ccc;
        resize: vertical;
        color: #666;
      }

      small {
        display: block;
        margin-top: 0.25rem;
        color: #999;
        font-size: 0.75rem;
        min-height: 14px;
      }

      small.error {
        color: #d70000;
        font-weight: 500;
      }

      button {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        border: none;
        background-color: #007Bff;
        color: white;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background-color: #0066ff;
      }

      button:disabled {
        opacity: 0.75;
        cursor: not-allowed;
      }

      .spinner {
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-top: 4px solid #fff;
        border-radius: 50%;
        width: 1em;
        height: 1em;
        animation: spin 1s linear infinite;
      }

      .downloads {
        margin: 2rem 0 0 0;
        padding: 2rem 0 0 0;
        border-top: 1px solid rgba(255, 255, 255, 0.75);
        transition: opacity 0.25s ease-in-out;
      }

      .downloads__heading {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 500;
      }

      .downloads ul {
        margin: 1rem 0 1rem 2rem;
        padding: 0;
        list-style: outside;
      }

      a,
      a:link,
      a:visited,
      a:active {
        color: #666;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .hidden {
        display: none;
      }

      .visible {
        opacity: 1;
      }

      .invisible {
        opacity: 0;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .console__log-output {
        padding: 0.75rem;
        border-radius: 0.5rem;
        background-color: #333;
        height: 100%;
        <!-- Todo: calculate max-height -->
        max-height: 300px;
      }

      pre {
        margin: 0;
        height: 100%;
        white-space: pre-wrap;
        font-family: "Ubuntu Mono", monospace;
        font-weight: 400;
        font-style: normal;
        color: #fff;
        overflow-y: auto;
      }

      #toast-container {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .toast {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 1rem 1rem;
        border-radius: 0.5rem;
        background-color: rgba(0, 123, 255, 0.85);
        color: #ffffff;
        font-weight: 400;
        width: 400px;
      }

      .toast.success {
        background-color: rgba(0, 147, 63, 0.85);
      }

      .toast.error {
        background-color: rgba(215, 0, 0, 0.85);
      }

      @keyframes slideIn {
        from { transform: translateX(100%); opacity: 0; }
        to   { transform: translateX(0); opacity: 1; }
      }

      @keyframes fadeOut {
        to { opacity: 0; transform: translateX(100%); }
      }
    </style>
  </head>
    <body>
      <h1 class="title">
        Escola Digital Report Generator
      </h1>

      <div class="console">
        <div class="console__actions">
          <form id="report-generator-form">
            <label for="report-name">
              <span>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-pen-icon lucide-square-pen"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg>
                Report name:
              </span>
              <input
                type="text"
                id="report-name"
                required
              />
              <small>Without white spaces (example: my-report)</small>
              <small class="error"></small>
            </label>

            <label for="report-nifs">
              <span>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-list-minus-icon lucide-list-minus"><path d="M11 12H3"/><path d="M16 6H3"/><path d="M16 18H3"/><path d="M21 12h-6"/></svg>
                NIFs:
              </span>
              <textarea
                id="report-nifs"
                rows="10"
                required
              ></textarea>
              <small>Comma separated values (example: 123456789, 987654321)</small>
              <small class="error"></small>
            </label>

            <button
              type="submit"
              id="report-run-button"
              disabled
            >
              Generate
              <span class="spinner hidden" />
            </button>
          </form>

          <div
            id="report-downloads"
            class="downloads invisible"
          >
            <div class="downloads__heading">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-cloud-download-icon lucide-cloud-download"><path d="M12 13v8l-4-4"/><path d="m12 21 4-4"/><path d="M4.393 15.269A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.436 8.284"/></svg>
              Generated report:
            </div>
            <ul>
              <li>
                <a
                  id="download-link"
                  href="#"
                >Link</a>
              </li>
            </ul>
          </div>
        </div>

        <div class="console__log">
          <div class="console__log-output">
            <pre id="output" />
          </div>
        </div>
      </div>

      <div id="toast-container" />

      <script src="../../dist/client/index.js"></script>
  </body>
</html>
